<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#d8bd76" />
    <title>Fluxo — Sem conexão</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #f3f0e8;
        background: #181818;
        font-family: system-ui, sans-serif;
      }
      main {
        width: min(100%, 420px);
        padding: 32px;
        border: 1px solid #ffffff18;
        border-radius: 20px;
        background: #202020;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 24px;
      }
      p {
        margin: 0 0 24px;
        color: #aaa69d;
        line-height: 1.5;
      }
      button {
        border: 0;
        border-radius: 10px;
        padding: 12px 18px;
        color: #181818;
        background: #d8bd76;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg?v=2" alt="" />
      <h1>Você está sem conexão</h1>
      <p>Reconecte-se à internet para consultar e atualizar as tarefas.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
